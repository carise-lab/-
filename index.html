<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>面接壁打ちアプリ｜桑原里歩さん専用</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0e0e0f;
  --bg2: #161618;
  --bg3: #1e1e21;
  --border: rgba(255,255,255,0.08);
  --border2: rgba(255,255,255,0.14);
  --text: #f0eff0;
  --text2: #9b9aa0;
  --text3: #5e5d64;
  --accent: #6c63ff;
  --accent2: #8b84ff;
  --good: #34c98a;
  --warn: #f5a623;
  --danger: #ff5f5f;
  --info: #5ba3f5;
  --radius: 12px;
  --radius-sm: 8px;
}

body {
  font-family: 'Noto Sans JP', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* Header */
.app-header {
  padding: 20px 24px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.app-title {
  font-size: 14px;
  font-weight: 500;
  color: var(--text2);
  letter-spacing: 0.04em;
}
.app-title span {
  color: var(--accent2);
  font-weight: 700;
}
.profile-chip {
  font-size: 12px;
  color: var(--text3);
  background: var(--bg3);
  border: 1px solid var(--border);
  padding: 4px 10px;
  border-radius: 20px;
  font-family: 'DM Mono', monospace;
}

/* Theme tabs */
.theme-bar {
  display: flex;
  gap: 6px;
  padding: 14px 24px;
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
  flex-shrink: 0;
  scrollbar-width: none;
}
.theme-bar::-webkit-scrollbar { display: none; }

.theme-btn {
  flex-shrink: 0;
  padding: 7px 14px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text2);
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.18s;
  white-space: nowrap;
}
.theme-btn:hover { border-color: var(--border2); color: var(--text); }
.theme-btn.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  font-weight: 500;
}

/* Progress dots */
.progress-bar {
  display: flex;
  gap: 8px;
  align-items: center;
  padding: 10px 24px;
  flex-shrink: 0;
}
.pdot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--bg3);
  border: 1px solid var(--border2);
  transition: all 0.2s;
}
.pdot.done { background: var(--good); border-color: var(--good); }
.pdot.current { background: var(--accent); border-color: var(--accent); width: 20px; border-radius: 4px; }
.progress-label {
  font-size: 11px;
  color: var(--text3);
  margin-left: 6px;
  font-family: 'DM Mono', monospace;
}

/* Main layout */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  max-width: 800px;
  width: 100%;
  margin: 0 auto;
  padding: 0 24px;
}

/* Chat area */
.chat {
  flex: 1;
  overflow-y: auto;
  padding: 20px 0;
  display: flex;
  flex-direction: column;
  gap: 16px;
  scrollbar-width: thin;
  scrollbar-color: var(--bg3) transparent;
}
.chat::-webkit-scrollbar { width: 4px; }
.chat::-webkit-scrollbar-track { background: transparent; }
.chat::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 4px; }

/* Messages */
.msg { display: flex; flex-direction: column; gap: 4px; }
.msg-label {
  font-size: 10px;
  color: var(--text3);
  font-family: 'DM Mono', monospace;
  letter-spacing: 0.06em;
  padding: 0 4px;
}
.msg.user .msg-label { text-align: right; }

.bubble {
  max-width: 85%;
  padding: 12px 16px;
  font-size: 14px;
  line-height: 1.75;
  border-radius: var(--radius);
}
.msg.ai .bubble {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 4px var(--radius) var(--radius) var(--radius);
  color: var(--text);
  align-self: flex-start;
}
.msg.user .bubble {
  background: var(--accent);
  color: #fff;
  border-radius: var(--radius) 4px var(--radius) var(--radius);
  align-self: flex-end;
}

/* FBK card inside bubble */
.fbk-block {
  margin-top: 10px;
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  overflow: hidden;
}
.fbk-row {
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
  line-height: 1.7;
}
.fbk-row:last-child { border-bottom: none; }
.fbk-tag {
  display: inline-block;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.06em;
  padding: 2px 8px;
  border-radius: 4px;
  margin-bottom: 6px;
  font-family: 'DM Mono', monospace;
}
.fbk-tag.good { background: rgba(52,201,138,0.15); color: var(--good); }
.fbk-tag.warn { background: rgba(245,166,35,0.15); color: var(--warn); }
.fbk-tag.danger { background: rgba(255,95,95,0.15); color: var(--danger); }
.fbk-tag.info { background: rgba(91,163,245,0.15); color: var(--info); }

/* Typing indicator */
.typing-dots {
  display: flex; gap: 5px; align-items: center;
  padding: 14px 18px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 4px var(--radius) var(--radius) var(--radius);
  width: fit-content;
}
.dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--text3);
  animation: pulse 1.2s ease-in-out infinite;
}
.dot:nth-child(2) { animation-delay: 0.2s; }
.dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes pulse {
  0%,80%,100% { transform: scale(0.7); opacity: 0.4; }
  40% { transform: scale(1); opacity: 1; }
}

/* Empty state */
.empty-state {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  color: var(--text3);
  padding: 40px 0;
}
.empty-icon {
  font-size: 36px;
  opacity: 0.4;
}
.empty-text {
  font-size: 14px;
  text-align: center;
  line-height: 1.7;
}
.empty-theme {
  font-size: 13px;
  color: var(--accent2);
  font-weight: 500;
}

/* Input area */
.input-area {
  padding: 16px 0 24px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.input-row {
  display: flex;
  gap: 10px;
  align-items: flex-end;
}
textarea {
  flex: 1;
  background: var(--bg2);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  color: var(--text);
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 14px;
  line-height: 1.6;
  padding: 12px 16px;
  resize: none;
  min-height: 80px;
  max-height: 200px;
  transition: border-color 0.15s;
  outline: none;
}
textarea:focus { border-color: var(--accent); }
textarea::placeholder { color: var(--text3); }

.send-btn {
  background: var(--accent);
  border: none;
  border-radius: var(--radius);
  color: #fff;
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 13px;
  font-weight: 500;
  padding: 0 20px;
  height: 80px;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
  letter-spacing: 0.02em;
}
.send-btn:hover { background: var(--accent2); }
.send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

.input-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.input-hint { font-size: 11px; color: var(--text3); font-family: 'DM Mono', monospace; }
.reset-btn {
  font-size: 11px; color: var(--text3);
  background: none; border: none;
  cursor: pointer; text-decoration: underline;
  font-family: 'Noto Sans JP', sans-serif;
}
.reset-btn:hover { color: var(--text2); }

/* Error */
.error-bubble {
  background: rgba(255,95,95,0.08);
  border: 1px solid rgba(255,95,95,0.2);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  font-size: 13px;
  color: var(--danger);
}
</style>
</head>

<div class="app-header">

<script>

const THEMES = [

転職理由では「なぜ今か・次で何をしたいか」の比重を8割にすること。
サンプル回答の目安は150〜200文字以内。`
  },
  {
    id: 2, name: "② キャリアビジョン",
    system: `あなたは採用コンサル・ITセールス職の面接に精通したキャリアコーチです。

let currentTheme = 0;
let histories = THEMES.map(() => []);
let isLoading = false;

function init() {
  const bar = document.getElementById('themeBar');
  bar.innerHTML = THEMES.map((t, i) =>
    `<button class="theme-btn ${i===0?'active':''}" onclick="setTheme(${i})">${t.name}</button>`
  ).join('');
  renderProgress();
  renderEmpty();
}

function renderProgress() {
  const bar = document.getElementById('progressBar');
  bar.innerHTML = '<span class="progress-label">進捗：</span>' +
    THEMES.map((t, i) => {
      const done = histories[i].filter(m=>m.role==='user').length >= 3;
      const cur = i === currentTheme;
      return `<div class="pdot ${done?'done':cur?'current':''}" title="${t.name}"></div>`;
    }).join('');
}

function setTheme(i) {
  currentTheme = i;
  document.querySelectorAll('.theme-btn').forEach((b, idx) => {
    b.classList.toggle('active', idx === i);
  });
  renderProgress();
  renderChat();
  document.getElementById('userInput').placeholder = `【${THEMES[i].name}】の回答を入力...`;
}

function resetTheme() {
  histories[currentTheme] = [];
  renderProgress();
  renderEmpty();
}

function renderEmpty() {
  const chat = document.getElementById('chat');
  chat.innerHTML = `
    <div class="empty-state">
      <div class="empty-icon">💬</div>
      <div class="empty-text">
        <div class="empty-theme">${THEMES[currentTheme].name}</div>
        回答を入力すると、コーチからの<br>深掘り質問とフィードバックが届きます
      </div>
    </div>`;
}

function renderChat() {
  const history = histories[currentTheme];
  if (history.length === 0) { renderEmpty(); return; }
  const chat = document.getElementById('chat');
  chat.innerHTML = history.map(m => {
    if (m.role === 'user') {
      return `<div class="msg user">
        <div class="bubble">${esc(m.content)}</div>
        <div class="msg-label">KUWABARA</div>
      </div>`;
    } else {
      return `<div class="msg ai">
        <div class="msg-label">COACH</div>
        <div class="bubble">${formatAI(m.content)}</div>
      </div>`;
    }
  }).join('');
  chat.scrollTop = chat.scrollHeight;
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

function formatAI(text) {
  if (!text.includes('---GOOD---')) {
    return `<div>${esc(text)}</div>`;
  }
  const parts = {
    good: extract(text, 'GOOD', 'IMPROVE'),
    improve: extract(text, 'IMPROVE', 'NG'),
    ng: extract(text, 'NG', 'SAMPLE'),
    sample: extract(text, 'SAMPLE', 'END')
  };
  const preText = text.split('---GOOD---')[0].trim();
  let html = preText ? `<div style="margin-bottom:12px">${esc(preText)}</div>` : '';
  html += `<div class="fbk-block">`;
  if (parts.good && parts.good !== 'なし') html += `<div class="fbk-row"><div class="fbk-tag good">✅ 良い点</div><div>${esc(parts.good)}</div></div>`;
  if (parts.improve && parts.improve !== 'なし') html += `<div class="fbk-row"><div class="fbk-tag warn">⚠️ 改善点</div><div>${esc(parts.improve)}</div></div>`;
  if (parts.ng && parts.ng !== 'なし') html += `<div class="fbk-row"><div class="fbk-tag danger">🚫 NGワード</div><div>${esc(parts.ng)}</div></div>`;
  if (parts.sample && parts.sample !== 'なし') html += `<div class="fbk-row"><div class="fbk-tag info">💡 改善サンプル</div><div>${esc(parts.sample)}</div></div>`;
  html += `</div>`;
  return html;
}

function extract(text, start, end) {
  const s = text.indexOf(`---${start}---`);
  const e = text.indexOf(`---${end}---`);
  if (s === -1) return '';
  const raw = e === -1 ? text.slice(s + start.length + 6) : text.slice(s + start.length + 6, e);
  return raw.trim();
}

document.getElementById('userInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

async function sendMessage() {
  if (isLoading) return;
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  histories[currentTheme].push({ role: 'user', content: text });

  const chat = document.getElementById('chat');
  if (histories[currentTheme].length === 1) chat.innerHTML = '';

  chat.innerHTML += `<div class="msg user">
    <div class="bubble">${esc(text)}</div>
    <div class="msg-label">KUWABARA</div>
  </div>`;

  const typingId = 'typing_' + Date.now();
  chat.innerHTML += `<div class="msg ai" id="${typingId}">
    <div class="msg-label">COACH</div>
    <div class="typing-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
  </div>`;
  chat.scrollTop = chat.scrollHeight;

  isLoading = true;
  document.getElementById('sendBtn').disabled = true;

  const messages = histories[currentTheme].map(m => ({ role: m.role, content: m.content }));

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json',
      'x-api-key': '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',
      'anthropic-version': '2023-06-01' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: THEMES[currentTheme].system,
        messages
      })
    });

    if (!res.ok) throw new Error(`API error: ${res.status}`);
    const data = await res.json();
    const reply = data.content?.[0]?.text || 'エラーが発生しました。';

    histories[currentTheme].push({ role: 'assistant', content: reply });

    const typingEl = document.getElementById(typingId);
    if (typingEl) {
      typingEl.innerHTML = `<div class="msg-label">COACH</div><div class="bubble">${formatAI(reply)}</div>`;
    }
    chat.scrollTop = chat.scrollHeight;
    renderProgress();

  } catch(err) {
    const typingEl = document.getElementById(typingId);
    if (typingEl) {
      typingEl.innerHTML = `<div class="msg-label">COACH</div><div class="error-bubble">エラーが発生しました。しばらくしてから再度お試しください。<br><small>${err.message}</small></div>`;
    }
  }

  isLoading = false;
  document.getElementById('sendBtn').disabled = false;
}

init();
</script>
